<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hollywood Casino Slots</title>
  <link rel="stylesheet" href="casino.css" />
</head>
<body>
  <div class="casino-app">
    <header>
      <h1>🎰 Hollywood Slots</h1>
      <div class="store">
        <h3>🪙 Token Store</h3>
        <ul>
          <li>500 Tokens - $4.99</li>
          <li>1000 Tokens - $8.99</li>
          <li>2500 Tokens - $17.99</li>
        </ul>
        <button class="btn-store">Go to Store</button>
      </div>
    </header>

    <main class="slots-container">
      <div class="slot-card" id="slot1">
        <h2>🔥 Jackpot Blaze</h2>
        <div class="slot-reel">
          <div class="reel" id="reel1">🍒</div>
          <div class="reel" id="reel2">🍋</div>
          <div class="reel" id="reel3">🍇</div>
        </div>
        <span class="multiplier">x5</span>
        <button class="btn-play" onclick="spin()">Spin</button>
      </div>
    </main>
  </div>

  <audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/10/31/audio_d2034c0308.mp3?filename=slot-machine-spin-113612.mp3"></audio>
  <audio id="winSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_74f22b92c2.mp3?filename=casino-bell-ding-112024.mp3"></audio>

  <script >
    const symbols = ["🍒", "🍋", "🍇", "7️⃣", "💎", "🍊"];
const reels = [document.getElementById("reel1"), document.getElementById("reel2"), document.getElementById("reel3")];
const spinSound = document.getElementById("spinSound");
const winSound = document.getElementById("winSound");

function spin() {
  spinSound.play();

  reels.forEach((reel, i) => {
    setTimeout(() => {
      reel.style.animation = "spin 1s ease-in-out";
      setTimeout(() => {
        reel.style.animation = "none";
        let result = symbols[Math.floor(Math.random() * symbols.length)];
        reel.textContent = result;
      }, 900);
    }, i * 300);
  });

  // Simulate win sound after all reels finish
  setTimeout(() => {
    if (Math.random() > 0.6) winSound.play(); // simulate win
  }, 2000);
}
  </script>
</body>
</html>
