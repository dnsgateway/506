<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Casino Slots</title>
  <link rel="stylesheet" href="casino.css" />
</head>
<body>
  <div class="casino-app">
    <header>
      <h1>🎰 Hollywood Casino Slots</h1>
      <div class="store">
        <h3>🪙 Buy Tokens</h3>
        <ul>
          <li>500 Tokens - $4.99</li>
          <li>1000 Tokens - $8.99</li>
          <li>2500 Tokens - $17.99</li>
          <button class="btn-store">Go to Store</button>
        </ul>
      </div>
    </header>

    <main class="slots-container">
      <div class="slot-card">
        <h2>Lucky 7s</h2>
        <div class="reels">🍒 🍋 🔔</div>
        <span class="multiplier">x3</span>
        <button class="btn-play">Play Now</button>
      </div>

      <div class="slot-card">
        <h2>Fruit Frenzy</h2>
        <div class="reels">🍇 🍉 🍓</div>
        <span class="multiplier">x5</span>
        <button class="btn-play">Play Now</button>
      </div>

      <div class="slot-card">
        <h2>Jackpot Blaze</h2>
        <div class="reels">🔥 💰 💎</div>
        <span class="multiplier">x10</span>
        <button class="btn-play">Play Now</button>
      </div>

      <div class="slot-card">
        <h2>Bar Bonanza</h2>
        <div class="reels">BAR BAR 🍒</div>
        <span class="multiplier">x4</span>
        <button class="btn-play">Play Now</button>
      </div>

      <div class="slot-card">
        <h2>Spin Royale</h2>
        <div class="reels">👑 💎 💰</div>
        <span class="multiplier">x7</span>
        <button class="btn-play">Play Now</button>
      </div>
    </main>
  </div>
</body>
</html>
