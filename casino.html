<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hollywood Casino Slots</title>
  <link rel="stylesheet" href="casino.css" />
</head>
<body>
  <div class="casino-app">
    <header>
      <h1>🎰 Hollywood Slots</h1>
      <div class="store">
        <h3>🪙 Token Store</h3>
        <ul>
          <li>500 Tokens - $4.99</li>
          <li>1000 Tokens - $8.99</li>
          <li>2500 Tokens - $17.99</li>
        </ul>
        <button class="btn-store">Go to Store</button>
      </div>
    </header>

    <main class="slots-container">
  <div class="slot-card" id="slot1" data-multiplier="5">
    <h2>🔥 Jackpot Blaze</h2>
    <div class="slot-reel">
      <div class="reel" id="reel1">🍒</div>
      <div class="reel" id="reel2">🍋</div>
      <div class="reel" id="reel3">🍇</div>
    </div>
    <span class="multiplier">x5</span>
    <button class="btn-play" onclick="spinCard('slot1')">▶ Play</button>
  </div>

  <!-- 2x Multiplier Slot -->
  <div class="slot-card" id="slot2" data-multiplier="2">
    <h2>🎰 Classic 2x Slot</h2>
    <div class="slot-reel">
      <div class="reel">🍒</div>
      <div class="reel">🍋</div>
      <div class="reel">🍇</div>
      <div class="reel">💎</div>
      <div class="reel">🍊</div>
    </div>
    <span class="multiplier">x2</span>
    <button class="btn-play" onclick="spinCard('slot2')">▶ Play</button>
    <p class="result-text">Get all rows and columns to match for 2x win!</p>
  </div>
<!-- 5x Multiplier Slot -->
  <div class="slot-card" id="slot3" data-multiplier="5">
    <h2>💥 Wild 5x Slot</h2>
    <div class="slot-reel">
      <div class="reel">🍇</div>
      <div class="reel">🍉</div>
      <div class="reel">🍒</div>
      <div class="reel">💎</div>
      <div class="reel">🍊</div>
    </div>
    <span class="multiplier">x5</span>
    <button class="btn-play" onclick="spinCard('slot3')">▶ Play</button>
    <p class="result-text">Get 2 full matching rows to win 5x!</p>
  </div>
</main>

  <audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/10/31/audio_d2034c0308.mp3?filename=slot-machine-spin-113612.mp3"></audio>
  <audio id="winSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_74f22b92c2.mp3?filename=casino-bell-ding-112024.mp3"></audio>

  <script >
    const symbols = ["🍒", "🍋", "🍇", "7️⃣", "💎", "🍊"];
const spinSound = document.getElementById("spinSound");
const winSound = document.getElementById("winSound");

function spinCard(cardId) {
  const card = document.getElementById(cardId);
  const reels = card.querySelectorAll(".reel");

  spinSound.play();

  reels.forEach((reel, index) => {
    reel.style.animation = "spin 1s ease-in-out";
    setTimeout(() => {
      const result = symbols[Math.floor(Math.random() * symbols.length)];
      reel.textContent = result;
      reel.style.animation = "none";
    }, 900 + index * 100);
  });

  setTimeout(() => {
    if (Math.random() > 0.6) winSound.play();
  }, 2000);
}
  </script>
</body>
</html>
