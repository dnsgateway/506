<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hollywood Casino Slots</title>
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: url('IMG_0623.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      backdrop-filter: brightness(0.8);
    }

    .casino-app {
      padding: 1rem;
      background-color: rgba(0, 0, 0, 0.75);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid #444;
      padding-bottom: 1rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: #00ffb3;
      text-shadow: 0 0 8px #00ffb3;
    }

    .user-card {
      background: rgba(0, 0, 0, 0.7);
      padding: 1rem;
      border: 1px solid #444;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .user-card img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #00eaff;
    }

    .user-card .info {
      display: flex;
      flex-direction: column;
    }

    .user-card .info .username {
      font-weight: bold;
      color: #00eaff;
    }

    .user-card .info .tokens {
      font-size: 1rem;
      margin-top: 0.2rem;
    }

    .store {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      max-width: 250px;
    }

    .store h3 {
      color: #00eaff;
      margin-bottom: 0.5rem;
    }

    .store ul {
      list-style: none;
      padding-left: 0;
      line-height: 1.8;
    }

    .btn-store {
      background-color: #00ff9f;
      border: none;
      padding: 0.5rem 1rem;
      margin-top: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
    }

    .slots-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 2rem;
    }

    .slot-card {
      width: 300px;
      background: linear-gradient(145deg, #111, #1a1a1a);
      border: 2px solid #00ff9f;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 0 15px #00ff9f50;
    }

    .slot-card .cost {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #00ff9f;
      color: #000;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .slot-reel-row {
      display: flex;
      justify-content: space-evenly;
      margin: 1.2rem 0;
      font-size: 2.5rem;
      background-color: #000;
      padding: 0.8rem;
      border: 1px solid #555;
      border-radius: 10px;
    }

    .reel {
      width: 60px;
      height: 60px;
      line-height: 60px;
      text-align: center;
      font-size: 2.5rem;
      background-color: #111;
      border-radius: 8px;
      box-shadow: inset 0 0 5px #333;
    }

    .btn-play {
      background-color: #ff007a;
      border: none;
      color: white;
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      margin-top: auto;
      color: #ccc;
      border-top: 1px solid #333;
    }

    .token-payout {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      color: gold;
      background: #000;
      padding: 0.5rem 1rem;
      border: 2px solid gold;
      border-radius: 10px;
      z-index: 1000;
      animation: riseFade 2s ease-out forwards;
    }

    @keyframes riseFade {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -150%) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="casino-app">
    <header>
      <h1>🎰 Hollywood Slots</h1>

      <div class="user-card">
        <img src="https://cdn-icons-png.flaticon.com/512/921/921347.png" alt="User Avatar">
        <div class="info">
          <span class="username">PlayerOne</span>
          <span class="tokens">💰 <span id="tokenCount">1000</span> Tokens</span>
        </div>
      </div>

      <div class="store">
        <h3>💰 Token Store</h3>
        <ul>
          <li>500 Tokens - $4.99</li>
          <li>1000 Tokens - $8.99</li>
          <li>2500 Tokens - $17.99</li>
        </ul>
        <button class="btn-store">Go to Store</button>
      </div>
    </header>

    <main class="slots-container">
      <div class="slot-card" data-cost="100" data-reels="jackpot">
        <h2>🔥 Jackpot Blaze</h2>
        <div class="slot-reel-row">
          <div class="reel">🍒</div>
          <div class="reel">🍋</div>
          <div class="reel">🍇</div>
        </div>
        <span class="cost">💰 100</span>
        <button class="btn-play" onclick="playSlot(this)">Spin</button>
      </div>

      <div class="slot-card" data-cost="75" data-reels="classic">
        <h2>🎰 Classic Triple</h2>
        <div class="slot-reel-row">
          <div class="reel">🍉</div>
          <div class="reel">💎</div>
          <div class="reel">🍊</div>
        </div>
        <span class="cost">💰 75</span>
        <button class="btn-play" onclick="playSlot(this)">Spin</button>
      </div>
    </main>

    <footer class="footer">
      © 2025 Hollywood Slots | Powered by WordPress. All rights reserved.
    </footer>
  </div>

  <audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/10/31/audio_d2034c0308.mp3"></audio>
  <audio id="winSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_74f22b92c2.mp3"></audio>

  <script>
    const spinSound = document.getElementById('spinSound');
    const winSound = document.getElementById('winSound');
    const tokenDisplay = document.getElementById('tokenCount');
    let tokens = 1000;
    const symbols = ["🍒", "🍋", "🍇", "7️⃣", "💎", "🍊"];

    function playSlot(button) {
      const card = button.closest('.slot-card');
      const reels = card.querySelectorAll('.reel');
      const cost = parseInt(card.getAttribute('data-cost'));

      if (tokens < cost) {
        alert('Not enough tokens!');
        return;
      }

      tokens -= cost;
      tokenDisplay.textContent = tokens;
      spinSound.play();

      const result = [];

      reels.forEach((reel, i) => {
        let interval = setInterval(() => {
          reel.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        }, 100);

        setTimeout(() => {
          clearInterval(interval);
          const final = symbols[Math.floor(Math.random() * symbols.length)];
          reel.textContent = final;
          result[i] = final;

          if (i === reels.length - 1) {
            const win = result.every(sym => sym === result[0]);
            if (win) {
              tokens += cost * 3;
              tokenDisplay.textContent = tokens;
              winSound.play();
              triggerTokenPayout(cost * 3);
            }
          }
        }, 1000 + i * 300);
      });
    }

    function triggerTokenPayout(amount) {
      const payout = document.createElement("div");
      payout.className = "token-payout";
      payout.innerHTML = `💰 +${amount}`;
      document.body.appendChild(payout);
      setTimeout(() => payout.remove(), 2000);
    }
  </script>
</body>
</html>
