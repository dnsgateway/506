<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rumble Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="logo">Ⓡ RUMBLE</div>
    <button class="btn-deposit">Deposit +</button>
  </header>

  <nav class="tabs">
    <button class="tab active">Basketball</button>
    <button class="tab">Soccer</button>
    <button class="tab">Tennis</button>
  </nav>

  <main class="dashboard">
    <section class="match">
      <h3>Euroleague</h3>
      <div class="matchup">
        <div class="team">Olympiakos <span class="score">15</span></div>
        <div class="team">Monaco <span class="score">12</span></div>
      </div>
      <div class="odds">
        <div>-2.5<br><small>-118</small></div>
        <div>O 0.19.5<br><small>-119</small></div>
        <div>-145</div>
        <div>+2.5<br><small>-115</small></div>
        <div>U 0.18.5<br><small>-115</small></div>
        <div>+114</div>
      </div>
    </section>

    <section class="match">
      <h3>Premier League</h3>
      <div class="matchup">
        <div class="team">Olympiskos <div class="jersey blue">1</div></div>
        <span class="vs">VS</span>
        <div class="team">Monaco <div class="jersey red">9</div></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active">Home</button>
    <button class="nav-btn">Live</button>
    <button class="nav-btn">Profile</button>
  </nav>
</body>
</html>
